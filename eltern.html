<!doctype html><html lang="de-CH"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e5ecdc"><title>EMILIAS DSCHUNGELCAMP – Elternzugang</title><link rel="stylesheet" href="camp.css"><style>input{text-transform:none}</style><main><aside aria-label="Emilia" role="img"></aside><h1>Elternbereich</h1><form><label>Benutzername <input id="user" autocomplete="username" required></label><label>Passwort <input id="pw" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form><p id="status" role="status"></p><a href="./">Zum Dschungelcamp</a></main><script>
document.querySelector('form').onsubmit=async e=>{
 e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;
 const status=document.querySelector('#status');status.textContent='Anmeldung läuft …';
 try{
 const raw=await fetch('studio.bin?v=6');if(!raw.ok)throw Error('download');const bytes=await raw.arrayBuffer();
 const username=document.querySelector('#user').value.trim().toLowerCase();
 if(!['teresa','mike'].includes(username))throw new DOMException('Login','OperationError');
 const credential=document.querySelector('#pw').value;
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(credential),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:new Uint8Array([176, 48, 72, 24, 204, 232, 60, 218, 168, 14, 107, 230, 249, 0, 141, 18]),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array([196, 82, 1, 90, 25, 178, 24, 172, 219, 104, 151, 247])},key,bytes);
 let bundled={error:true};
 if(username==='mike'){
  try{
   const response=await fetch('voice-bundle.bin?v=mike-2026-11-23-1');
   if(!response.ok)throw Error('download');
   const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array([7, 185, 44, 245, 7, 72, 27, 177, 142, 137, 76, 173])},key,await response.arrayBuffer());
   bundled=JSON.parse(new TextDecoder().decode(decrypted));
  }catch{bundled={error:true}}
 }
 const payload=JSON.stringify(bundled).replace(/</g,'\\u003c');
 const tag='<script type="application/json" id="bundledVoiceData">'+payload+'<\/script>';
 const page=new TextDecoder().decode(html).replace('<html lang="de-CH"','<html lang="de-CH" data-parent="'+username+'"').replace('<script>',tag+'<script>');
 document.open();document.write(page);document.close();
 }catch(err){status.textContent=err.name==='OperationError'?'Benutzername oder Passwort stimmt nicht.':'Studio konnte nicht geöffnet werden. Lade die Seite erneut.';button.disabled=false}
};
</script></html>
