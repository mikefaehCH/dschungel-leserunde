<!doctype html><html lang="de-CH"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buchstabentafel · Dschungelcamp</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f1;color:#233e35;font:1rem system-ui}main{max-width:800px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:1rem}h1{font-size:clamp(20px,4vw,30px);margin:0}a,#close{color:#fff;background:#315744;padding:12px 16px;border:0;border-radius:12px;text-decoration:none;font:inherit}.group{display:grid;gap:1px;background:#98a39a;border:1px solid #98a39a;border-radius:10px;overflow:hidden}.tile{border:0;border-radius:0;margin:0;padding:0;display:grid;min-width:0;background:white;color:#25372e;cursor:pointer;font:inherit}.tile:focus-visible{outline:3px solid #175a90;outline-offset:-3px;z-index:1}.letters{display:flex;background:#f8e2da;align-items:stretch}.letters b{font:normal clamp(18px,3.6vw,31px)/1.35 Arial,sans-serif;flex:1;text-align:center}.letters b+b{border-left:1px solid #adb9af}.image{display:grid;place-items:center;height:clamp(44px,8vw,68px)}.pic,.image svg{height:96%;aspect-ratio:1;width:auto;max-width:100%}.pic{background:url(art/buchstabentafel.webp) var(--x) var(--y)/700% 600%}.vowels{width:85%;margin:auto;grid-template-columns:repeat(5,1fr)}.middle,.bottom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,3vw,26px);margin-top:15px}.middle{width:85%;margin-inline:auto;column-gap:17%}.middle .tile{grid-template-columns:1fr 1fr;align-items:stretch}.left .image{order:-1}.middle .letters{background:#d8e9dd}.middle .letters b{display:grid;place-items:center}.middle .image{height:clamp(44px,7vw,56px)}.blue{grid-template-columns:repeat(3,minmax(0,1fr))}.blue .letters{background:#daebf4}.blue b{font-size:clamp(14px,3.2vw,28px)}dialog{width:min(360px,90vw);border:0;border-radius:18px;padding:20px;text-align:center}dialog::backdrop{background:#12382bc9}dialog .letters{justify-content:center;background:white}dialog .letters b{font-size:44px;flex:0 1 auto;padding:0 8px;border:0}dialog .image{height:150px;margin:10px}#close{min-width:100px;cursor:pointer}@media(max-width:560px){main{padding:10px}.vowels,.middle{width:100%}.middle{column-gap:12%}.bottom{column-gap:6px}.blue b{font-family:"Arial Narrow",sans-serif}}@media print{header a,dialog{display:none}main{max-width:16cm}*{print-color-adjust:exact}}

e"><span class="pic" style="--x:16.6667%;--y:20%"></span></span></button><button class="tile" aria-label="S, Sonne"><span class="letters"><b>S</b><b>s</b></span><span class="image"><span class="pic" style="--x:33.3333%;--y:20%"></span></span></button><button class="tile" aria-label="H, Hexe"><span class="letters"><b>H</b><b>h</b></span><span class="image"><span class="pic" style="--x:50.0000%;--y:20%"></span></span></button><button class="tile" aria-label="M, Mond"><span class="letters"><b>M</b><b>m</b></span><span class="image"><span class="pic" style="--x:66.6667%;--y:20%"></span></span></button></div><div class="group right"><button class="tile" aria-label="B, Birne"><span class="letters"><b>B</b><b>b</b></span><span class="image"><span class="pic" style="--x:83.3333%;--y:20%"></span></span></button><button class="tile" aria-label="D, Dinosaurier"><span class="letters"><b>D</b><b>d</b></span><span class="image"><span class="pic" style="--x:100.0000%;--y:20%"></span></span></button><button class="tile" aria-label="G, Gabel"><span class="letters"><b>G</b><b>g</b></span><span class="image"><span class="pic" style="--x:0.0000%;--y:40%"></span></span></button><button class="tile" aria-label="W, Wal"><span class="letters"><b>W</b><b>w</b></span><span class="image"><span class="pic" style="--x:16.6667%;--y:40%"></span></span></button><button class="tile" aria-label="L, Lampe"><span class="letters"><b>L</b><b>l</b></span><span class="image"><span class="pic" style="--x:33.3333%;--y:40%"></span></span></button><button class="tile" aria-label="R, Rose"><span class="letters"><b>R</b><b>r</b></span><span class="image"><span class="pic" style="--x:50.0000%;--y:40%"></span></span></button><button class="tile" aria-label="N, Nashorn"><span class="letters"><b>N</b><b>n</b></span><span class="image"><span class="pic" style="--x:66.6667%;--y:40%"></span></span></button></div></div><div class="bottom"><div class="group blue"><button class="tile" aria-label="Ä, Äpfel"><span class="letters"><b>Ä</b><b>ä</b></span><span class="image"><span class="pic" style="--x:83.3333%;--y:40%"></span></span></button><button class="tile" aria-label="Ö, Ölflasche"><span class="letters"><b>Ö</b><b>ö</b></span><span class="image"><span class="pic" style="--x:100.0000%;--y:40%"></span></span></button><button class="tile" aria-label="Ü, Schiessübung"><span class="letters"><b>Ü</b><b>ü</b></span><span class="image"><span class="pic" style="--x:0.0000%;--y:60%"></span></span></button></div><div class="group blue"><button class="tile" aria-label="Sch, Schaf"><span class="letters"><b>Sch</b><b>sch</b></span><span class="image"><span class="pic" style="--x:16.6667%;--y:60%"></span></span></button><button class="tile" aria-label="Ch, Kind"><span class="letters"><b>Ch</b><b>ch</b></span><span class="image"><span class="pic" style="--x:33.3333%;--y:60%"></span></span></button><button class="tile" aria-label="Qu, Qualle"><span class="letters"><b>Qu</b><b>qu</b></span><span class="image"><span class="pic" style="--x:50.0000%;--y:60%"></span></span></button></div><div class="group blue"><button class="tile" aria-label="Au, Auto"><span class="letters"><b>Au</b><b>au</b></span><span class="image"><span class="pic" style="--x:66.6667%;--y:60%"></span></span></button><button class="tile" aria-label="Eu, Eule"><span class="letters"><b>Eu</b><b>eu</b></span><span class="image"><span class="pic" style="--x:83.3333%;--y:60%"></span></span></button><button class="tile" aria-label="Ei, Ei"><span class="letters"><b>Ei</b><b>ei</b></span><span class="image"><span class="pic" style="--x:100.0000%;--y:60%"></span></span></button></div><div class="group blue"><button class="tile" aria-label="Sp, Spinne"><span class="letters"><b>Sp</b><b>sp</b></span><span class="image"><span class="pic" style="--x:0.0000%;--y:80%"></span></span></button><button class="tile" aria-label="St, Stern"><span class="letters"><b>St</b><b>st</b></span><span class="image"><span class="pic" style="--x:16.6667%;--y:80%"></span></span></button><button class="tile" aria-label="C, Computer"><span class="letters"><b>C</b><b>c</b></span><span class="image"><span class="pic" style="--x:33.3333%;--y:80%"></span></span></button></div><div class="group blue"><button class="tile" aria-label="…ng, Ring"><span class="letters"><b class="wide">…ng</b></span><span class="image"><span class="pic" style="--x:50.0000%;--y:80%"></span></span></button><button class="tile" aria-label="Y, Katze"><span class="letters"><b>Y</b><b>y</b></span><span class="image"><span class="pic" style="--x:66.6667%;--y:80%"></span></span></button><button class="tile" aria-label="J, Jacke"><span class="letters"><b>J</b><b>j</b></span><span class="image"><span class="pic" style="--x:83.3333%;--y:80%"></span></span></button></div><div class="group blue"><button class="tile" aria-label="V, Vogel"><span class="letters"><b>V</b><b>v</b></span><span class="image"><span class="pic" style="--x:100.0000%;--y:80%"></span></span></button><button class="tile" aria-label="X, Hund"><span class="letters"><b>X</b><b>x</b></span><span class="image"><span class="pic" style="--x:0.0000%;--y:100%"></span></span></button><button class="tile" aria-label="Z, Zitrone"><span class="letters"><b>Z</b><b>z</b></span><span class="image"><svg viewBox="0 0 100 85" aria-hidden="true"><path d="M11 48Q5 39 16 37Q33 11 65 22Q74 24 82 32Q96 32 89 43Q76 70 45 67Q21 67 11 48Z" fill="#f4d752" stroke="#ab892e" stroke-width="2"/><path d="M20 42q9-17 26-17" fill="none" stroke="#ffed92" stroke-width="5" stroke-linecap="round"/><g fill="#b89935"><circle cx="66" cy="54" r="1.4"/><circle cx="71" cy="50" r="1.2"/><circle cx="60" cy="58" r="1"/></g></svg></span></button></div></div></main><dialog aria-label="Vergrösserte Buchstabenkarte"><div id="detail"></div><button id="close" autofocus>Zurück zur Tafel</button></dialog><script>
const dialog=document.querySelector('dialog');
document.querySelector('main').addEventListener('click',event=>{
 const tile=event.target.closest('.tile');
 if(!tile)return;
 document.querySelector('#detail').replaceChildren(...Array.from(tile.children,node=>node.cloneNode(true)));
 dialog.setAttribute('aria-label',tile.getAttribute('aria-label'));
 dialog.showModal();
});
document.querySelector('#close').onclick=()=>dialog.close();
</script></html>
